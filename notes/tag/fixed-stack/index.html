  <!-- ⌘K command palette (ninja-keys): jumps to any PUBLISHED note. No visible
       nav trigger — ninja-keys binds Cmd/Ctrl+K itself. The item list
       (notes-index.json) is published-only in every build, so private note
       titles never ship. -->
  <ninja-keys placeholder="Search published notes…" hideBreadcrumbs></ninja-keys>
  <!-- +esm bundle: bare imports (lit, hotkeys-js) resolved so the module loads in
       the browser and registers <ninja-keys>. The plain dist/ build does NOT. -->
  <script type="module"
          src="https://cdn.jsdelivr.net/npm/ninja-keys@1.2.2/+esm"></script>
  <script>
    (function () {
      var BASE = "../../../";
      Promise.all([
        fetch(BASE + "notes-index.json").then(function (r) { return r.ok ? r.json() : []; }),
        customElements.whenDefined("ninja-keys")
      ]).then(function (res) {
        var ninja = document.querySelector("ninja-keys");
        ninja.data = res[0].map(function (it, i) {
          return {
            id: "n" + i,
            title: it.title,
            section: it.taxon || "Notes",
            keywords: it.taxon || "",
            handler: function () { window.location.href = BASE + it.url; }
          };
        });
      }).catch(function () {});
    })();
  </script>
